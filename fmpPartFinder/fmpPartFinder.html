<template>
    <div class="finder-layout">
        <c-fmp-sidebar-search
            manufacturer-options={manufacturerOptions}
            model-options={modelOptions}
            type-options={typeOptions}
            selected-manufacturer={selectedManufacturer}
            selected-model={selectedModel}
            selected-manufacturer-label={selectedManufacturerLabel}
            selected-model-label={selectedModelLabel}
            serial-number={serialNumber}
            selected-type={selectedType}
            is-loading-manufacturers={isLoadingManufacturers}
            manufacturer-error={manufacturerError}
            can-select-model={canSelectModel}
            can-search={canSearch}
            manufacturer-reset-key={manufacturerResetKey}
            model-reset-key={modelResetKey}
            onfilterchange={handleCriteriaChange}
            onsearch={handleSearch}
            onreset={handleReset}
            onretry={loadManufacturers}>
        </c-fmp-sidebar-search>
        <c-fmp-parts-results
            is-loading={isSearching}
            error-message={partsError}
            catalog-warning={catalogWarning}
            has-searched={hasSearched}
            rows={visibleParts}
            total-results={totalResults}
            search-term={resultSearchTerm}
            sort-by={sortBy}
            page-size={pageSize}
            current-page={currentPage}
            selected-count={selectedCount}
            selected-active-count={selectedActiveCount}
            selected-request-count={selectedRequestCount}
            selected-review-count={selectedReviewCount}
            opportunity-button-label={selectionOpportunityLabel}
            onsearchchange={handleResultSearch}
            onsortchange={handleSortChange}
            onpagesizechange={handlePageSizeChange}
            onpagechange={handlePageChange}
            onselectionchange={handleSelectionChange}
            onpageselectionchange={handlePageSelectionChange}
            onclearselection={handleClearSelection}
            ondownload={handleDownload}
            onretry={handleRetrySearch}
            onimageerror={handleImageError}
            onpartaction={handlePartAction}>
        </c-fmp-parts-results>
    </div>
</template>
